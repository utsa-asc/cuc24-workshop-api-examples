<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
</head>

<body>
    <script src="/tinymce/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
        tinymce.init({
          selector: '#mytextarea',
          license_key: 'gpl',
          element_format: 'xhtml',
          entity_encoding: 'numeric',
          convert_urls: false,
          valid_elements: '@[class|style|id],-span[!class|!style],p,-strong/b,-em/i,-h1,-h2,-h3,-h4,-h5,-h6,-blockquote,-pre,-ul[type],-li[value],-ol[reversed|start],iframe[*],br,figure,-figcaption,hr,table[*],-thead,-tbody,-tr[*],td[*],-th[*],-tfoot,-code,-picture,-source,-script,-style,-sub,-sup,-video,-abbr,-address,-cite,-dd,-dl,-dt,-pre,-svg,-time,img[!src|alt|width|height|loading=lazy],-a[!href|!name|target|title|rel]',
          extended_valid_elements: 'script[src|async|defer|type|charset]'
        });
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.1.0/papaparse.min.js"></script>
    <script src="../../cascade-restapi.js"></script>
    <script>
        /* Note: Creating the skeleton of new pages for a site redesign can be extremely helpful
           creating them manually, not so much. to ensure pages can be created without errors, 
           we want to ensure the folders they have to go in already exist 
           its easier and faster to create all folders first before creating any pages
           the 2 functions below could be combined into a single, bigger, more complex function but I prefer we keep it simple
           like the principle... and the band! */

        /* Exercise 1: Automate creation of "skeleton" folders and pages by reading from two csv files 
           (/workshop-scripts/csv/folders.csv) and (/workshop-scripts/csv/folders.csv) */

        /* Step 1.1: Add your site name to the siteName variable  */
        /* Step 1.2: Follow instructor's demonstration as the script is reviewed. We will create the folders first then create 
           pages to populate in the folders in the Redesign folder on your site */


        // var siteName = "WS-Garza"; // fill in
        const siteName = "TEACHING-VPAA-ASC-HALSTORE";
        const CSV_FILE = "./csv/tldt.csv"; // fill in

        // Function to convert text with line breaks to HTML with <br/> tags
        function convertTextToHTML(plainText) {
            if (!plainText) return '';
            
            // Initialize TinyMCE if not already done
            if (!tinymce.activeEditor) {
                console.log('TinyMCE not initialized yet. Please wait...');
                return plainText;
            }
            
            // Replace line breaks with <br/> tags
            let htmlContent = plainText
                .replace(/\r\n/g, '<br/>') // Windows line breaks
                .replace(/\n/g, '<br/>')   // Unix/Mac line breaks
                .replace(/\r/g, '<br/>');  // Old Mac line breaks
            
            // Set content in TinyMCE to clean and format it
            tinymce.activeEditor.setContent(htmlContent);
            
            // Get the cleaned HTML content
            return tinymce.activeEditor.getContent();
        }

        // Example usage function
        function demonstrateTextConversion() {
            const sampleText = `This is line one
This is line two
This is line three

This has an empty line above it`;
            
            console.log('Original text:');
            console.log(sampleText);
            
            const convertedHTML = convertTextToHTML(sampleText);
            console.log('Converted HTML:');
            console.log(convertedHTML);
            
            // Display in the textarea
            document.getElementById('mytextarea').value = convertedHTML;
        }

        // Function to convert custom text input
        function convertCustomText() {
            const inputText = document.getElementById('inputText').value;
            if (!inputText.trim()) {
                alert('Please enter some text to convert');
                return;
            }
            
            const convertedHTML = convertTextToHTML(inputText);
            document.getElementById('output').innerHTML = `<strong>Converted HTML:</strong><br><pre>${convertedHTML.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre><br><strong>Rendered Result:</strong><br>${convertedHTML}`;
        }

        cleanContent();

        function cleanContentFromRow(rows) {
            for (const p of rows.data) {
                const type = p.Type;
                const stype = p.SourceType;

                try {
                    if ((type == "page") & (stype == "WordPress")) {
                        var path = p.URI;
                        var parentFolder = path.substr(0, path.lastIndexOf("/"));
                        var pageName = path.substring(path.lastIndexOf("/") + 1);
                        pageName = pageName.replace('.html', '');
                        // #1 first we copy

                        readAsset({
                            type: "page",
                            path: parentFolder + "/" + pageName,
                            siteName: siteName,                
                        }).then(function(pageAsset) {
                            if (pageAsset.read_status == "Success") {
                            //  #2 then we copy
                                var dirtyContent = pageAsset.apiReturn.asset.page.structuredData.structuredDataNodes[2].structuredDataNodes[2];
                                if (dirtyContent.text != undefined) {

                                    tinymce.activeEditor.setContent(dirtyContent.text);
                                    var cleanText = tinymce.activeEditor.getContent();
                                    // console.log(dirtyContent.text);
                                    // console.log(cleanText);
                                    pageAsset.apiReturn.asset.page.structuredData.structuredDataNodes[2].structuredDataNodes[2].text = cleanText
                                    console.log("updating page: " + p.URI);
                                    // editAsset({
                                    //     asset: pageAsset.apiReturn,
                                    // }).then(function(result) {
                                    //     console.log("Edited: " + result.edit_status + " - " + p.URI);
                                    //     // console.log(result);
                                    // }).catch(function(error) {
                                    //     console.log(error);
                                    // });
                                }
                            }
                        }).catch(function (error) {
                            console.log(error);
                        });
                    }
                }  catch (e) {
                    //continue;
                    console.log("ERROR while processing row");
                    console.log(e);
                }
            }
        }

        function cleanContent() {
            // Note: you'll want to make sure 
            Papa.parse(CSV_FILE, {
                header: true,
                download: true,
                skipEmptyLines: true,
                transformHeader: function(h) {
                    return h.replace(/[\W_]+/g, "").trim();
                },
                complete: cleanContentFromRow
            });
        }
    </script>

<form method="post">
    <textarea id="mytextarea">Hello, World!</textarea>
    <br><br>
    <button type="button" onclick="demonstrateTextConversion()">Convert Sample Text to HTML</button>
    <br><br>
    <div>
        <h3>Convert Your Own Text:</h3>
        <textarea id="inputText" rows="6" cols="50" placeholder="Enter your text with line breaks here..."></textarea>
        <br><br>
        <button type="button" onclick="convertCustomText()">Convert to HTML</button>
        <br><br>
        <div id="output" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px; min-height: 50px;">
            <em>Converted HTML will appear here...</em>
        </div>
    </div>
  </form>
</body>

</html>
