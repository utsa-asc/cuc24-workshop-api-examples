        /* Exercise 2: Read folder asset using asset asset path */

        /* Step 2.1: Comment out Exercise 1 above from lines 17-31 */
        /* Step 2.2: Uncomment out Exercise 2 below from lines 40-62 */
        /* Step 2.3: Add a folder path and your site name on lines 42/43
        /* Step 2.5: Save, view console log, refresh browser */

        readAsset({
            type: "folder",
            path: "/about/_profile-blocks", // fill in
            siteName: "PROVOST-VPAA-PROVWEB" // fill in
        }).then(function(result) {
            console.log(result);
            // Note: result is the object the read function returns
            var folderChildren = result.apiReturn.asset.folder.children;
            // Note: drill down to the array of children in the folder
            folderChildren.forEach(function(child) {
                readAsset({
                    type: child.type,
                    id: child.id,
                }).then(function(result) {
                    console.log("READ ASSET:");
                    console.log(result.apiReturn.asset);
                    var oldURL = result.apiReturn.asset.symlink.linkURL;
                    let liveURL = oldURL.replace("https://port0.utsa.edu/handbook", "https://global.utsa.edu/students/handbook");
                    result.apiReturn.asset.symlink.linkURL = liveURL;
                    editAsset({
                        asset: result.apiReturn
                    }).then(function(result) {
                        console.log("SYMLINKEDITED");
                        console.log(result);
                    }).catch(function(error) {
                        console.log("EDIT FAILED");
                        console.log(error);
                    });
                }).catch(function(error) {
                    console.log(error);
                });
                // Note: loop over the children and read each child
            });
        }).catch(function(error) {
            console.log(error);
        });
    </script>
